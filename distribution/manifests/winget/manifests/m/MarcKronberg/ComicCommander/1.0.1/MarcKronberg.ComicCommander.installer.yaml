# Comic Commander 1.0.1 – installers from the GitHub release v1.0.1 (sha256 from the release API, re-checked locally).
# Both installers are unsigned. The winget validation pipeline may flag that – then report, do not change anything.

PackageIdentifier: MarcKronberg.ComicCommander
PackageVersion: 1.0.1
MinimumOSVersion: 10.0.0.0
ReleaseDate: 2026-10-25
Installers:
  # NSIS (Tauri), per-user install without admin rights. Silent switch /S is the NSIS default.
  # ProductCode left out on purpose: Tauri's NSIS template registers the uninstall entry under
  # HKCU\...\Uninstall\Comic Commander – confirm in the validation result before adding "ProductCode: Comic Commander".
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://github.com/krocon/comic-commander-tauri/releases/download/v1.0.1/Comic.Commander_1.0.1_x64-setup.exe
    InstallerSha256: 1F4BAA5C529B5B615B0CC0AE66B47F1CD61C8C57F6C27D65B1DEBE7CA374D197
    UpgradeBehavior: install
    AppsAndFeaturesEntries:
      - DisplayName: Comic Commander
        Publisher: Marc Kronberg
  # WiX MSI (Tauri), per-machine install into %ProgramFiles%\Comic Commander. Codes read from the MSI Property table.
  - Architecture: x64
    InstallerType: wix
    Scope: machine
    InstallerUrl: https://github.com/krocon/comic-commander-tauri/releases/download/v1.0.1/Comic.Commander_1.0.1_x64_en-US.msi
    InstallerSha256: F5DC02010F1A27D270B7B0DE5893F9BED4EF9A5036203B6B00970EC787035215
    ProductCode: '{FA2852D9-42C5-40A1-9E4B-99010BD847D9}'
    UpgradeBehavior: install
    AppsAndFeaturesEntries:
      - DisplayName: Comic Commander
        Publisher: Marc Kronberg
        ProductCode: '{FA2852D9-42C5-40A1-9E4B-99010BD847D9}'
        UpgradeCode: '{7F69796D-3EDA-5EA5-879F-E390896FF088}'
