[package]
name = "comic-commander-tauri"
version = "0.1.0"
description = "Comic browser with cover thumbnails (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/comic-commander-tauri"
edition = "2024"
rust-version = "1.93"

[lib]
name = "cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
# design 003: reading comic books (no external programs) and making cover thumbnails
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4.46", default-features = false }
# design 003 E6: RAR through the vendored UnRAR source (C++, unRAR licence) – as in files-and-folders
unrar-ng-sys = "=0.7.7"
# design 003 E7: 7z with the fail-closed header check taken over from files-and-folders
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd"] }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std"] }
crc32fast = "1.5"
open = "5"
# design 006 E1: PDF pages and covers, pure Rust (no FFI, no external program)
hayro = "0.8.0"
# design 006 (review #1): our own bounded decoding of PDF streams before hayro sees them
flate2 = "1"
# design 011 E1: ComicInfo.xml – pull parser without DTD/external entities, already in the tree via `plist`
quick-xml = { version = "0.42", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[dev-dependencies]
tempfile = "3"
# design 003: writing 7z test books
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "compress"] }

# design 006: decoders and the PDF renderer optimised in debug builds too (`pnpm tauri dev`: a PDF page
# takes seconds unoptimised); our own code stays debuggable
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package."hayro-interpret"]
opt-level = 3
[profile.dev.package."hayro-syntax"]
opt-level = 3
[profile.dev.package."hayro-jpeg2000"]
opt-level = 3
[profile.dev.package."hayro-jbig2"]
opt-level = 3
[profile.dev.package."hayro-ccitt"]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package."pic-scale"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
