[package]
name = "comic-commander-tauri"
version = "0.1.0"
description = "Comic browser with cover thumbnails (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/comic-commander-tauri"
edition = "2024"
rust-version = "1.93"

[lib]
name = "cc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }

[dev-dependencies]
tempfile = "3"
